name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Show package identity
        run: |
          node -p "const p=require('./package.json'); p.name+'@'+p.version+' repo='+p.repository.url"
          node -v && npm -v
      - name: Publish
        run: npm publish